<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoRewarder</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #1f1f23;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f2f3f5;
    }
    .card {
      width: 296px;
      min-height: 318px;
      padding: 30px 28px 25px;
      text-align: center;
      border-radius: 12px;
      background: #2b2d31;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
    }
    .logo-tile {
      width: 104px;
      height: 88px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #5865f2;
      box-shadow: 0 8px 20px rgba(88, 101, 242, .28);
      animation: tile-breathe 2.2s ease-in-out infinite;
    }
    .logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      animation: logo-float 1.8s ease-in-out infinite;
    }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    #stage { margin: 16px 0 17px; font-size: 14px; font-weight: 700; }
    #detail { margin: 14px 0 0; color: #b5bac1; font-size: 12px; }
    .track { height: 6px; overflow: hidden; border-radius: 999px; background: #484b51; }
    #bar { width: 2%; height: 100%; border-radius: inherit; background: #5865f2; transition: width .24s ease; }
    @keyframes tile-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes logo-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="logo-tile"><img class="logo" src="../assets/icon.ico" alt="AutoRewarder"></div>
    <h1 id="title">Updating AutoRewarder</h1>
    <p id="stage">Closing AutoRewarder…</p>
    <div class="track"><div id="bar"></div></div>
    <p id="detail">The new version will open automatically.</p>
  </main>
  <script>
    const COPY = {
      en: { title: "Updating AutoRewarder", closing: "Closing AutoRewarder…", downloading: "Downloading…", installing: "Installing…", replacing: "Replacing the old version…", cleaning: "Cleaning up…", finished: "Opening the new version…", detail: "The new version will open automatically.", error: "The update could not be installed." },
      es: { title: "Actualizando AutoRewarder", closing: "Cerrando AutoRewarder…", downloading: "Descargando…", installing: "Instalando…", replacing: "Reemplazando la versión anterior…", cleaning: "Limpiando…", finished: "Abriendo la nueva versión…", detail: "La nueva versión se abrirá automáticamente.", error: "No se pudo instalar la actualización." },
      pt: { title: "Atualizando o AutoRewarder", closing: "Fechando o AutoRewarder…", downloading: "Baixando…", installing: "Instalando…", replacing: "Substituindo a versão anterior…", cleaning: "Limpando…", finished: "Abrindo a nova versão…", detail: "A nova versão será aberta automaticamente.", error: "Não foi possível instalar a atualização." },
      zh: { title: "正在更新 AutoRewarder", closing: "正在关闭 AutoRewarder…", downloading: "正在下载…", installing: "正在安装…", replacing: "正在替换旧版本…", cleaning: "正在清理…", finished: "正在打开新版本…", detail: "新版本会自动打开。", error: "无法安装更新。" }
    };
    let lang = "en";
    function copy(key) { return (COPY[lang] || COPY.en)[key] || COPY.en[key]; }
    function render(stage, progress, detail) {
      document.getElementById("title").textContent = copy("title");
      document.getElementById("stage").textContent = stage === "error" ? copy("error") : copy(stage || "installing");
      document.getElementById("detail").textContent = detail || copy("detail");
      const base = { closing: 0, downloading: 5, installing: 35, replacing: 65, cleaning: 85, finished: 100 }[stage] || 0;
      const fraction = typeof progress === "number" ? progress : 0;
      const value = stage === "downloading" ? Math.min(35, 5 + fraction * 30) : Math.max(base, base + fraction * 15);
      document.getElementById("bar").style.width = Math.round(value) + "%";
    }
    function update_progress(stage, progress, detail) { render(stage, progress, detail); }
    window.addEventListener("pywebviewready", function () {
      pywebview.api.get_settings().then(function (settings) {
        lang = settings.ui_locale || "en";
        render("closing", 0);
        return pywebview.api.start_update();
      }).catch(function (error) {
        render("error", 0, error && error.message ? error.message : copy("detail"));
      });
    });
  </script>
</body>
</html>
