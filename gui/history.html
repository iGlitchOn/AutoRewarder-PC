<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Execution History</title>

  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>

  <div class="history-header">
    <h2 class="history-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      Execution history
    </h2>
    <div class="history-toolbar">
      <div class="history-filters" role="tablist" aria-label="Filter history">
        <button type="button" class="hist-filter active" data-filter="all">All</button>
        <button type="button" class="hist-filter" data-filter="success">Success</button>
        <button type="button" class="hist-filter" data-filter="error">Errors</button>
      </div>
      <span id="account_pill" class="account-pill" hidden></span>
    </div>
  </div>

  <table class="history-table">
    <thead>
      <tr>
        <th class="col-date">Date</th>
        <th class="col-time">Time</th>
        <th class="col-query">Activity</th>
        <th class="col-status">Status</th>
      </tr>
    </thead>
    <tbody id="table_body">
      <tr>
        <td colspan="4" class="empty-row">Loading…</td>
      </tr>
    </tbody>
  </table>

  <script>
    function avatar_initials_hist(label) {
      const s = (label || '?').trim();
      if (!s) return '?';
      const parts = s.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2);
      return (parts[0][0] + parts[parts.length - 1][0]);
    }

    window.addEventListener('pywebviewready', function() {

      pywebview.api.get_current_account().then(function(account) {
        const pill = document.getElementById('account_pill');
        if (!pill) return;
        if (account) {
          pill.hidden = false;
          pill.innerHTML = '';
          const avatar = document.createElement('span');
          avatar.className = 'avatar avatar-sm';
          // Deterministic color (same palette as main UI).
          const palette = ['#5b8eff', '#e879a0', '#f59e0b', '#34d399', '#a78bfa', '#fbbf24', '#fb7185', '#22d3ee'];
          let h = 0; for (let i = 0; i < account.id.length; i++) h = (h * 31 + account.id.charCodeAt(i)) | 0;
          avatar.style.backgroundColor = palette[Math.abs(h) % palette.length];
          avatar.style.color = 'white';
          avatar.textContent = avatar_initials_hist(account.label);
          const text = document.createElement('span');
          text.textContent = account.label;
          pill.appendChild(avatar);
          pill.appendChild(text);
        }
      });

      let historyRows = [];
      let historyFilter = 'all';

      function isErrorStatus(status) {
        const s = String(status || '');
        return /error|fail|incomplete|warning/i.test(s);
      }

      function activityLabel(item) {
        const raw = String(item.query || '').trim();
        if (!raw) return 'Activity';
        if (/^(search|daily set|daily tasks|ready to claim|more activities|punchcards|visual search|check-in|news|edge browsing|bing app|run)\b/i.test(raw)) {
          return raw;
        }
        return 'Search: ' + raw;
      }

      function render_history() {
        const tbody = document.getElementById('table_body');
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

        if (!historyRows.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'empty-row';
          td.textContent = 'No runs yet. Start one from the main window.';
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }

        const rows = historyRows.filter((item) => {
          const err = isErrorStatus(item.status);
          if (historyFilter === 'error') return err;
          if (historyFilter === 'success') return !err;
          return true;
        });

        if (!rows.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'empty-row';
          td.textContent = historyFilter === 'error'
            ? 'No errors in this history.'
            : 'No successful entries in this history.';
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }

        for (const item of rows) {
          const statusClass = isErrorStatus(item.status) ? 'status-error' : 'status-success';
          const tr = document.createElement('tr');

          const dateTd = document.createElement('td');
          dateTd.className = 'cell-meta';
          dateTd.textContent = item.date;

          const timeTd = document.createElement('td');
          timeTd.className = 'cell-meta';
          timeTd.textContent = item.time;

          const queryTd = document.createElement('td');
          queryTd.textContent = activityLabel(item);

          const statusTd = document.createElement('td');
          statusTd.className = statusClass;
          statusTd.textContent = item.status;

          tr.appendChild(dateTd);
          tr.appendChild(timeTd);
          tr.appendChild(queryTd);
          tr.appendChild(statusTd);
          tbody.appendChild(tr);
        }
      }

      document.querySelectorAll('.hist-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          historyFilter = btn.getAttribute('data-filter') || 'all';
          document.querySelectorAll('.hist-filter').forEach((b) => {
            b.classList.toggle('active', b === btn);
          });
          render_history();
        });
      });

      pywebview.api.get_history().then(function(data) {
        historyRows = Array.isArray(data) ? data.slice().reverse() : [];
        render_history();
      }).catch(function () {
        const body = document.getElementById('table_body');
        if (body) body.innerHTML = '<tr><td colspan="4" class="empty-row">Could not load history.</td></tr>';
      });
    });
  </script>

</body>
</html>
