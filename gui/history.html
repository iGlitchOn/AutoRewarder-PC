<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="title_history">Execution History</title>

  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>

  <div class="history-header">
    <h2 class="history-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span data-i18n="execution_history">Execution history</span>
    </h2>
    <div class="history-toolbar">
      <div class="history-filters" role="tablist" aria-label="Filter history" data-i18n="filter_history">
        <button type="button" class="hist-filter active" data-filter="all" data-i18n="all">All</button>
        <button type="button" class="hist-filter" data-filter="success" data-i18n="success">Success</button>
        <button type="button" class="hist-filter" data-filter="error" data-i18n="errors">Errors</button>
      </div>
      <span id="account_pill" class="account-pill" hidden></span>
    </div>
  </div>

  <table class="history-table">
    <thead>
      <tr>
        <th class="col-date" data-i18n="date">Date</th>
        <th class="col-time" data-i18n="time">Time</th>
        <th class="col-query" data-i18n="activity">Activity</th>
        <th class="col-status" data-i18n="status">Status</th>
      </tr>
    </thead>
    <tbody id="table_body">
      <tr>
        <td colspan="4" class="empty-row" data-i18n="loading">Loading…</td>
      </tr>
    </tbody>
  </table>

  <script src="i18n.js"></script>
  <script>
    function avatar_initials_hist(label) {
      const s = (label || '?').trim();
      if (!s) return '?';
      const parts = s.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2);
      return (parts[0][0] + parts[parts.length - 1][0]);
    }

    window.addEventListener('pywebviewready', function() {

      pywebview.api.get_current_account().then(function(account) {
        const pill = document.getElementById('account_pill');
        if (!pill) return;
        if (account) {
          pill.hidden = false;
          pill.innerHTML = '';
          const avatar = document.createElement('span');
          avatar.className = 'avatar avatar-sm';
          // Deterministic color (same palette as main UI).
          const palette = ['#5b8eff', '#e879a0', '#f59e0b', '#34d399', '#a78bfa', '#fbbf24', '#fb7185', '#22d3ee'];
          let h = 0; for (let i = 0; i < account.id.length; i++) h = (h * 31 + account.id.charCodeAt(i)) | 0;
          avatar.style.backgroundColor = palette[Math.abs(h) % palette.length];
          avatar.style.color = 'white';
          avatar.textContent = avatar_initials_hist(account.label);
          const text = document.createElement('span');
          text.textContent = account.label;
          pill.appendChild(avatar);
          pill.appendChild(text);
        }
      });

      let historyRows = [];
      let historyFilter = 'all';

      function isErrorStatus(status) {
        const s = String(status || '');
        return /error|fail|incomplete|warning/i.test(s);
      }

      function activityLabel(item) {
        const raw = String(item.query || '').trim();
        if (!raw) return t('activity');
        const known = [
          [/^daily set/i, 'daily_tasks'], [/^daily tasks/i, 'daily_tasks'], [/^ready to claim/i, 'tasks'],
          [/^more activities/i, 'activity'], [/^punchcards/i, 'activity'], [/^visual search/i, 'visual_searches'],
          [/^check-in/i, 'checkin'], [/^news/i, 'news'], [/^edge browsing/i, 'edge_minutes'], [/^bing app/i, 'phone'],
          [/^run/i, 'run']
        ];
        for (const pair of known) if (pair[0].test(raw)) return t(pair[1]);
        return t('searches') + ': ' + raw;
      }

      function statusLabel(status) {
        const raw = String(status || '').trim();
        if (!raw) return t('unknown');
        if (/^ok\s*[—-]/i.test(raw)) return t('status.ok') + raw.replace(/^ok\s*[—-]/i, ' —');
        if (/^skipped\s*[—-]/i.test(raw)) return t('status.skipped') + raw.replace(/^skipped\s*[—-]/i, ' —');
        if (/^\[error\]/i.test(raw)) return t('status.error_prefix') + raw.slice(7);
        if (/^\[warning\]/i.test(raw)) return t('status.warning_prefix') + raw.slice(9);
        const exact = { 'done': 'status.done', 'pending': 'status.pending', 'partial': 'status.partial', 'unknown': 'status.unknown' };
        if (exact[raw.toLowerCase()]) return t(exact[raw.toLowerCase()]);
        return tr(raw);
      }

      function render_history() {
        const tbody = document.getElementById('table_body');
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

        if (!historyRows.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'empty-row';
          td.textContent = t('no_runs_yet');
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }

        const rows = historyRows.filter((item) => {
          const err = isErrorStatus(item.status);
          if (historyFilter === 'error') return err;
          if (historyFilter === 'success') return !err;
          return true;
        });

        if (!rows.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'empty-row';
          td.textContent = historyFilter === 'error' ? t('no_errors_history') : t('no_success_history');
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }

        for (const item of rows) {
          const statusClass = isErrorStatus(item.status) ? 'status-error' : 'status-success';
          const tr = document.createElement('tr');

          const dateTd = document.createElement('td');
          dateTd.className = 'cell-meta';
          dateTd.textContent = item.date;

          const timeTd = document.createElement('td');
          timeTd.className = 'cell-meta';
          timeTd.textContent = item.time;

          const queryTd = document.createElement('td');
          queryTd.textContent = activityLabel(item);

          const statusTd = document.createElement('td');
          statusTd.className = statusClass;
          statusTd.textContent = statusLabel(item.status);

          tr.appendChild(dateTd);
          tr.appendChild(timeTd);
          tr.appendChild(queryTd);
          tr.appendChild(statusTd);
          tbody.appendChild(tr);
        }
      }

      document.querySelectorAll('.hist-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          historyFilter = btn.getAttribute('data-filter') || 'all';
          document.querySelectorAll('.hist-filter').forEach((b) => {
            b.classList.toggle('active', b === btn);
          });
          render_history();
        });
      });

      pywebview.api.get_history().then(function(data) {
        historyRows = Array.isArray(data) ? data.slice().reverse() : [];
        render_history();
      });
    });
  </script>

</body>
</html>
